<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator India - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .form-box { background: #1e293b; padding: 25px; border-radius: 10px; width: 360px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #2563eb; border: none; color: #fff; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        .link-text { text-align: center; margin-top: 15px; font-size: 13px; color: #38bdf8; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2 id="form-title">Aviator India Login</h2>
        
        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)">
            <input type="email" id="login-email" placeholder="Email Address" required>
            <input type="password" id="login-pass" placeholder="Password" required>
            <button type="submit" style="background: #2563eb;">Login</button>
            <div class="link-text" onclick="switchView('register')">Don't have an account? Register</div>
            <div class="link-text" onclick="switchView('forgot')" style="color: #facc15; margin-top: 8px;">Forgot Password?</div>
        </form>

        <!-- Register Form -->
        <form id="reg-form" style="display: none;" onsubmit="handleRegister(event)">
            <input type="text" id="reg-name" placeholder="Full Name" required>
            <input type="email" id="reg-email" placeholder="Email Address" required>
            <div style="display: flex; gap: 5px;">
                <select id="country-code" style="width: 40%;">
                    <option value="+91">+91 (India)</option>
                    <option value="+880">+880 (BD)</option>
                </select>
                <input type="text" id="reg-phone" placeholder="Phone Number" style="width: 60%;" required>
            </div>
            <input type="password" id="reg-pass" placeholder="Password" required>
            <input type="password" id="reg-repass" placeholder="Re-enter Password" required>
            <input type="text" id="reg-ref" placeholder="Referral Code (Optional)">
            <button type="submit" style="background: #16a34a;">Register</button>
            <div class="link-text" onclick="switchView('login')">Already have an account? Login</div>
        </form>

        <!-- Forgot Password Form -->
        <form id="forgot-form" style="display: none;" onsubmit="handleForgot(event)">
            <input type="email" id="forgot-email" placeholder="Enter your registered Email" required>
            <button type="submit" style="background: #ca8a04;">Reset Password</button>
            <div class="link-text" onclick="switchView('login')">Back to Login</div>
        </form>
    </div>

    <script>
        function switchView(view) {
            document.getElementById('login-form').style.display = view === 'login' ? 'block' : 'none';
            document.getElementById('reg-form').style.display = view === 'register' ? 'block' : 'none';
            document.getElementById('forgot-form').style.display = view === 'forgot' ? 'block' : 'none';
            
            let titles = { login: 'Aviator India Login', register: 'Aviator India Register', forgot: 'Password Recovery' };
            document.getElementById('form-title').innerText = titles[view];
        }

        function handleRegister(e) {
            e.preventDefault();
            let name = document.getElementById('reg-name').value;
            let email = document.getElementById('reg-email').value;
            let phone = document.getElementById('country-code').value + document.getElementById('reg-phone').value;
            let pass = document.getElementById('reg-pass').value;
            let repass = document.getElementById('reg-repass').value;
            let refCode = document.getElementById('reg-ref').value;

            if(pass !== repass) {
                alert('❌ Passwords do not match!');
                return;
            }

            let generatedRef = name.toUpperCase().replace(/\s+/g, '') + Math.floor(100 + Math.random() * 900);

            let userData = {
                name, email, phone, pass, balance: 0, refCode: generatedRef, referredBy: refCode || 'None', status: 'Active'
            };

            // Save user data for Login & Admin panel
            localStorage.setItem(email, JSON.stringify(userData));
            
            let allUsers = JSON.parse(localStorage.getItem('allUsers') || '[]');
            allUsers.push(userData);
            localStorage.setItem('allUsers', JSON.stringify(allUsers));

            localStorage.setItem('currentUser', email);

            if(confirm('✅ Registration Successful! Click OK to join our official Telegram Group.')) {
                window.location.href = 'https://t.me/+bju2uhZlu7c2NmJk';
            } else {
                window.location.href = 'home.html';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            let email = document.getElementById('login-email').value;
            let pass = document.getElementById('login-pass').value;

            let user = JSON.parse(localStorage.getItem(email));
            if(user && user.pass === pass) {
                if(user.status === 'Suspended') {
                    alert('❌ Your account is suspended!');
                    return;
                }
                localStorage.setItem('currentUser', email);
                window.location.href = 'home.html';
            } else {
                alert('❌ Invalid Email or Password!');
            }
        }

        function handleForgot(e) {
            e.preventDefault();
            let email = document.getElementById('forgot-email').value;
            let user = JSON.parse(localStorage.getItem(email));
            if(user) {
                alert('📩 Password recovery link sent to ' + email);
                switchView('login');
            } else {
                alert('❌ Email not found!');
            }
        }
    </script>
</body>
</html>
