<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator India - Game Home</title>
    <style>
        body { background: #090d16; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .notice-board { background: #dc2626; color: white; padding: 10px; text-align: center; font-weight: bold; }
        .header { background: #111827; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1f2937; }
        .nav-links a { color: #38bdf8; text-decoration: none; margin-left: 10px; font-size: 14px; }
        .container { max-width: 800px; margin: 20px auto; padding: 15px; text-align: center; }
        .game-box { background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .plane-screen { width: 100%; height: 280px; background: #0f172a; border-radius: 8px; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; border: 1px solid #334155; }
        #multiplier { font-size: 55px; font-weight: bold; color: #22c55e; }
        .btn-group { margin-top: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 12px 20px; color: #fff; border-radius: 5px; font-weight: bold; cursor: pointer; border: none; font-size: 14px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="notice-board" id="notice-display">📢 নোটিশ: স্বাগতম Aviator India-এ!</div>
    
    <div class="header">
        <h2>✈️ Aviator India</h2>
        <div class="nav-links">
            <span>ব্যালেন্স: ৳<strong id="bal-show">0</strong></span>
            <a href="profile.php" onclick="event.preventDefault(); location.href='profile.html';">প্রোফাইল</a>
            <a href="deposit.html">ডিপোজিট</a>
            <a href="index.html" style="color: #ef4444;">লগআউট</a>
        </div>
    </div>

    <div class="container">
        <div class="game-box">
            <div class="plane-screen">
                <div id="multiplier">1.00x</div>
            </div>
            <div id="prediction-box" style="margin-top: 15px; color: #facc15; font-weight: bold;"></div>
            <div class="btn-group">
                <a href="deposit.html" class="btn" style="background: #16a34a;">টাকা ডিপোজিট করুন</a>
                <a href="withdraw.html" class="btn" style="background: #ca8a04;">উইথড্র করুন</a>
                <a href="history.html" class="btn" style="background: #2563eb;">হিস্ট্রি ও অ্যাক্টিভিটি</a>
            </div>
        </div>
    </div>

    <script>
        let currEmail = localStorage.getItem('currentUser');
        let userData = JSON.parse(localStorage.getItem(currEmail));
        if(userData) {
            document.getElementById('bal-show').innerText = userData.balance;
        }

        // নোটিশ লোড
        let savedNotice = localStorage.getItem('adminNotice');
        if(savedNotice) document.getElementById('notice-display').innerText = "📢 নোটিশ: " + savedNotice;

        // অ্যাডমিন প্রেডিকশন ও লাইভ বিমান উড়ার লজিক
        let mult = 1.00;
        function startFlight() {
            mult = 1.00;
            let elem = document.getElementById('multiplier');
            elem.style.color = "#22c55e";
            
            // অ্যাডমিন যদি নির্দিষ্ট কোনো প্রেডিকশন সেট করে থাকে
            let customCrash = localStorage.getItem('nextCrash_' + currEmail);
            let crashAt = customCrash ? parseFloat(customCrash) : (Math.random() * 4 + 1.3).toFixed(2);
            
            if(customCrash) {
                document.getElementById('prediction-box').innerText = "⭐ স্পেশাল প্রেডিকশন সেট করা আছে!";
            } else {
                document.getElementById('prediction-box').innerText = "";
            }

            let timer = setInterval(() => {
                mult += 0.04;
                elem.innerText = mult.toFixed(2) + "x";
                if(mult >= crashAt) {
                    clearInterval(timer);
                    elem.style.color = "#ef4444";
                    elem.innerText = "CRASHED! (" + crashAt + "x)";
                    // একবার ব্যবহার হওয়ার পর কাস্টম প্রেডিকশন মুছে ফেলা
                    localStorage.removeItem('nextCrash_' + currEmail);
                    setTimeout(startFlight, 4000);
                }
            }, 200);
        }
        setTimeout(startFlight, 1500);
    </script>
</body>
</html>
